---

name: Zizmor Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write

    runs-on: ubuntu-latest

    env:
      ZIZMOR_VERSION: 1.20.0

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Run Zizmor
        run: |
          uvx zizmor=="$ZIZMOR_VERSION" \
            --format sarif \
            .github \
            > zizmor_scan_report.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor_scan_report.sarif

      - name: Upload Zizmor report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-results
          path: zizmor_scan_report.sarif
          retention-days: 7
