{{- if .Values.rps.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rps
  name: rps
spec:
  ports:
  - port: 8080
    name: websockets
    protocol: TCP
    targetPort: 8080
  - port: 8081
    name: webapi
    protocol: TCP
    targetPort: 8081
  selector:
    app: rps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rps
spec:
  replicas: {{ .Values.rps.replicaCount }}
  selector:
    matchLabels:
      app: rps
  template:
    metadata:
      labels:
        app: rps
    spec:
      imagePullSecrets:
        - name: registrycredentials
      containers:
        - name: rps
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          image:  {{ .Values.images.rps }}
          readinessProbe:
            httpGet:
              path: /api/v1/admin/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: "RPS_LOG_LEVEL"
              value: "{{ .Values.rps.logLevel }}"
            - name: "RPS_VAULT_ADDRESS"
              value: "http://{{ .Release.Name }}-vault:8200"
            - name: "RPS_SECRETS_PATH"
              value: 'kv/data/'
            - name: "RPS_MPS_SERVER"
              value: "http://console:3000"
            - name: "RPS_CONNECTION_STRING"
              valueFrom:
                secretKeyRef:
                  name: rps
                  key: connectionString
            - name: RPS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault
                  key: vaultKey
          ports:
            - containerPort: 8080
              name: rps
            - containerPort: 8081
              name: rpsweb
---
# Seeds a throwaway self-signed 'MPSCerts' Vault secret so rps's CIRA/TLS
# root-key lookup (activation.ts fetchMPSRootKey) has something to read.
# That secret used to be created on startup by the old standalone mps
# microservice (mps/src/utils/certificates.ts storeCertificates); console
# replaces mps but never writes it, so nothing in this chart does anymore
# and rps activation fails with 'Failed to fetch MPS root key from vault'.
# Not for production: generates a brand-new root cert on every cluster where
# the secret is absent, rather than a real provisioned MPS root of trust.
# Uses Vault's own PKI engine to generate the cert instead of openssl, so the
# only image needed is hashicorp/vault (already pulled for the Vault pod
# itself) and no outbound internet access is required from the pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed-mps-certs
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-mps-certs
          image: hashicorp/vault:1.21
          command: ["sh", "-c"]
          args:
            - |
              set -e
              export VAULT_ADDR="http://{{ .Release.Name }}-vault:8200"
              # kv-v2 mount this chart's other components read from; dev-mode
              # Vault only auto-mounts 'secret', so it may not exist yet.
              vault secrets enable -path=kv kv-v2 2>/dev/null || true
              if vault kv get -field=root_key kv/MPSCerts > /dev/null 2>&1; then
                echo "MPSCerts already present in Vault; nothing to do."
                exit 0
              fi
              vault secrets enable -path=pki-mpscerts pki 2>/dev/null || true
              vault secrets tune -max-lease-ttl=87600h pki-mpscerts > /dev/null
              vault write -format=json pki-mpscerts/root/generate/exported \
                common_name="MPSRoot" ttl=87600h > /tmp/root.json
              root_key=$(grep '"private_key"' /tmp/root.json | sed -E 's/^[[:space:]]*"private_key": ?"(.*)",?[[:space:]]*$/\1/')
              root_ca=$(grep '"certificate"' /tmp/root.json | sed -E 's/^[[:space:]]*"certificate": ?"(.*)",?[[:space:]]*$/\1/')
              printf '{"root_key":"%s","root_ca":"%s","web_tls_config":{"ca":"%s"},"mps_tls_config":{"ca":"%s"}}' \
                "$root_key" "$root_ca" "$root_ca" "$root_ca" > /tmp/mps_certs.json
              vault kv put kv/MPSCerts @/tmp/mps_certs.json
              vault secrets disable pki-mpscerts 2>/dev/null || true
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault
                  key: vaultKey
{{- end }}
