name: Helm lint
on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint chart
        run: helm lint charts
      - name: Template (cloud)
        run: helm template console charts -f charts/values-cloud.yaml > /dev/null
      - name: Template (on-prem)
        run: helm template console charts -f charts/values-onprem.yaml > /dev/null
