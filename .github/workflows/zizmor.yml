---

name: Zizmor Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write

    runs-on: ubuntu-latest

    env:
      ZIZMOR_VERSION: 1.20.0

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Run Zizmor
        run: |
          uvx zizmor=="$ZIZMOR_VERSION" \
            --format sarif \
            .github \
            > zizmor_scan_report.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: zizmor_scan_report.sarif

      - name: Upload Zizmor report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-results
          path: zizmor_scan_report.sarif
          retention-days: 7
